# /etc/kim/kimd.conf - read by kim.service (systemd EnvironmentFile syntax).
# After editing: sudo systemctl restart kim
#
# Default: MONITOR ONLY. Each boot the daemon learns a baseline from the first
# 3 complete scans, then checks every scan (one per second) and reports
# changes to the journal, syslog (tag kim-integrity) and auditd
# (ausearch -m TRUSTED_APP). Nothing is enforced.
KIMD_OPTS="-q -L 3 -i 1000"

# Enforcement (raises lockdown to confidentiality and sets
# kernel.modules_disabled=1 on a critical event; ONE-WAY UNTIL REBOOT):
#KIMD_OPTS="-q -L 3 -i 1000 -e -A lockdown,modules"
#
# Useful flags (kimd -h for all): -N mod1,mod2 modules expected to load/unload;
# -W ktext treat patch-like kernel text changes as info; -i ms scan interval.

# kernel_extractor module parameters (modinfo kernel_extractor), e.g. ring_slots=2048
KIM_MODULE_OPTS=""
